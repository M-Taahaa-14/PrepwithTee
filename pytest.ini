[pytest]
testpaths = tests
addopts = -ra --strict-markers -m "not live and not e2e"
markers =
    live: calls a real paid API (Anthropic); run by hand with -m live
    e2e: needs a running local server + Playwright browser
    slow: builds real PDFs; takes more than a few seconds
# Default run skips anything that costs money or needs a browser.
# Run them explicitly:  pytest -m e2e   /   pytest -m live
