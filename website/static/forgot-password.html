<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — PrepWithTee</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="preload" as="style" onload="this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=20260831a">
  <style>
    .fp-icon { font-size: 2.5rem; display: block; text-align: center; margin-bottom: .4rem; }
    .fp-success-ico { font-size: 3rem; display: block; margin-bottom: .75rem; text-align: center; }
    .fp-back { text-align: center; margin-top: 1.25rem; font-size: .88rem; color: var(--grey); }
    .fp-back a { color: var(--accent); text-decoration: none; }
    .fp-back a:hover { text-decoration: underline; }
    .fp-success { text-align: center; padding: .5rem 0 1rem; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img width="52" height="52" src="logo-nav.webp" alt="PrepWithTee owl logo">
        <span>PrepWithTee</span>
      </a>
      <div class="header-right"></div>
    </div>
  </header>

  <main class="auth-page auth-page-single">
    <div class="auth-card">

      <div id="fp-form-view">
        <div class="auth-head" style="text-align:center">
          <span class="fp-icon">🔑</span>
          <h1>Forgot your password?</h1>
          <p class="auth-sub" style="margin:0 auto">Enter your account email and we'll send you a reset link.</p>
        </div>

        <div class="auth-alert" id="fp-alert" hidden role="alert"></div>

        <form class="auth-form" id="fp-form" novalidate>
          <label class="auth-field">
            <span>Email address</span>
            <input type="email" id="fp-email" name="email"
              autocomplete="email" placeholder="you@email.com" required>
          </label>

          <button class="btn btn-gold" id="fp-btn" type="submit" style="width:100%;justify-content:center">
            Send reset link
          </button>
        </form>

        <p class="fp-back">Remembered it? <a href="login.html">Back to Sign in</a></p>
      </div>

      <div id="fp-success-view" hidden class="fp-success">
        <span class="fp-success-ico">📬</span>
        <h2 style="color:var(--purple)">Check your email</h2>
        <p class="auth-sub" style="margin:.5rem auto 0">
          A reset link is on its way — it expires in 1 hour.<br>
          Check your spam folder if it doesn't arrive in a minute.
        </p>
        <p class="fp-back"><a href="login.html">← Back to Sign in</a></p>
      </div>

    </div>
  </main>

  <script>
    const form        = document.getElementById("fp-form");
    const btn         = document.getElementById("fp-btn");
    const alertEl     = document.getElementById("fp-alert");
    const formView    = document.getElementById("fp-form-view");
    const successView = document.getElementById("fp-success-view");

    function showAlert(msg) { alertEl.textContent = msg; alertEl.hidden = false; }
    function clearAlert()   { alertEl.hidden = true; }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById("fp-email").value.trim();
      if (!email) { showAlert("Please enter your email address."); return; }
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showAlert(data.detail || "Something went wrong. Please try again.");
          btn.disabled = false;
          btn.textContent = "Send reset link";
          return;
        }
        formView.hidden = true;
        successView.hidden = false;
      } catch {
        showAlert("Network error — please try again.");
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });
  </script>

</body>
</html>
