<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password — PrepWithTee</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="preload" as="style" onload="this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=20260831a">
  <style>
    .pw-field { position: relative; }
    .pw-eye {
      position: absolute; right: .7rem; bottom: .55rem;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: .15rem .3rem; line-height: 1;
    }
    .pw-eye:hover { color: var(--accent); }
    .pw-strength { height: 4px; border-radius: 2px; background: var(--border); margin: .35rem 0 .15rem; overflow: hidden; }
    .pw-strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; }
    .pw-strength-label { font-size: .75rem; color: var(--text-muted); min-height: 1em; }
    .rp-success { text-align: center; padding: 1.5rem 0 .5rem; }
    .rp-success-ico { font-size: 3rem; display: block; margin-bottom: .75rem; }
    .rp-invalid { text-align: center; padding: 1.5rem 0 .5rem; }
    .rp-invalid-ico { font-size: 3rem; display: block; margin-bottom: .75rem; }
    .rp-back { text-align: center; margin-top: 1.25rem; font-size: .88rem; color: var(--grey); }
    .rp-back a { color: var(--accent); text-decoration: none; }
    .rp-back a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img width="52" height="52" src="logo-nav.webp" alt="PrepWithTee owl logo">
        <span>PrepWithTee</span>
      </a>
      <div class="header-right"></div>
    </div>
  </header>

  <main class="auth-page auth-page-single">
    <div class="auth-card">

      <!-- Invalid / missing token -->
      <div id="rp-invalid-view" hidden class="rp-invalid">
        <span class="rp-invalid-ico">⚠️</span>
        <h2>Invalid link</h2>
        <p class="auth-sub" style="margin-top:.5rem" id="rp-invalid-msg">
          This reset link is invalid or has expired.
        </p>
        <a href="forgot-password.html" class="btn btn-gold" style="margin-top:1.25rem;display:inline-block">
          Request a new link
        </a>
      </div>

      <!-- Reset form -->
      <div id="rp-form-view" hidden>
        <div class="auth-head" style="text-align:center">
          <h1>Set a new password</h1>
          <p class="auth-sub" style="margin:0 auto">Choose something strong you haven't used before.</p>
        </div>

        <div class="auth-alert" id="rp-alert" hidden role="alert"></div>

        <form class="auth-form" id="rp-form" novalidate>
          <label class="auth-field">
            <span>New password</span>
            <div class="pw-field">
              <input type="password" id="rp-pw" name="password"
                autocomplete="new-password" placeholder="At least 8 characters" required>
              <button type="button" class="pw-eye" id="rp-eye1" aria-label="Show password">
                <svg id="rp-eye1-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="rp-eye1-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div class="pw-strength"><div class="pw-strength-bar" id="rp-strength-bar" style="width:0"></div></div>
            <div class="pw-strength-label" id="rp-strength-label"></div>
          </label>

          <label class="auth-field">
            <span>Confirm password</span>
            <div class="pw-field">
              <input type="password" id="rp-confirm" name="confirm"
                autocomplete="new-password" placeholder="Repeat the password" required>
              <button type="button" class="pw-eye" id="rp-eye2" aria-label="Show password">
                <svg id="rp-eye2-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="rp-eye2-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </label>

          <button class="btn btn-gold" id="rp-btn" type="submit" style="width:100%;justify-content:center">
            Save new password
          </button>
        </form>

        <p class="rp-back"><a href="forgot-password.html">← Request a different reset link</a></p>
      </div>

      <!-- Success -->
      <div id="rp-success-view" hidden class="rp-success">
        <span class="rp-success-ico">✅</span>
        <h2>Password updated!</h2>
        <p class="auth-sub" style="margin-top:.5rem">
          You're signed in. Taking you to your dashboard…
        </p>
      </div>

    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token  = params.get("token");

    const formView    = document.getElementById("rp-form-view");
    const invalidView = document.getElementById("rp-invalid-view");
    const successView = document.getElementById("rp-success-view");
    const alertEl     = document.getElementById("rp-alert");
    const btn         = document.getElementById("rp-btn");

    function showAlert(msg) { alertEl.textContent = msg; alertEl.hidden = false; }

    if (!token) {
      invalidView.hidden = false;
    } else {
      formView.hidden = false;
    }

    // Eye toggles
    function wireEye(eyeBtn, input, openSvg, closedSvg) {
      eyeBtn.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        openSvg.style.display   = show ? "none" : "";
        closedSvg.style.display = show ? "" : "none";
      });
    }
    wireEye(
      document.getElementById("rp-eye1"),
      document.getElementById("rp-pw"),
      document.getElementById("rp-eye1-open"),
      document.getElementById("rp-eye1-closed")
    );
    wireEye(
      document.getElementById("rp-eye2"),
      document.getElementById("rp-confirm"),
      document.getElementById("rp-eye2-open"),
      document.getElementById("rp-eye2-closed")
    );

    // Password strength
    const COLORS = ["#e53935","#e53935","#fb8c00","#43a047","#00897b"];
    const LABELS = ["","Weak","Medium","Strong","Very strong"];

    document.getElementById("rp-pw").addEventListener("input", function() {
      const v = this.value;
      let score = 0;
      if (v.length >= 8)            score++;
      if (/[A-Z]/.test(v))          score++;
      if (/[a-z]/.test(v))          score++;
      if (/\d/.test(v))             score++;
      if (/[^A-Za-z0-9]/.test(v))  score++;
      const bar   = document.getElementById("rp-strength-bar");
      const label = document.getElementById("rp-strength-label");
      bar.style.width      = (score * 20) + "%";
      bar.style.background = COLORS[score] || "#e53935";
      label.textContent    = LABELS[Math.min(score, 4)] || "";
      label.style.color    = COLORS[score] || "#e53935";
    });

    document.getElementById("rp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      alertEl.hidden = true;
      const pw      = document.getElementById("rp-pw").value;
      const confirm = document.getElementById("rp-confirm").value;
      if (pw.length < 8)    { showAlert("Password must be at least 8 characters."); return; }
      if (pw !== confirm)   { showAlert("Passwords don't match."); return; }
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.detail || "Something went wrong.";
          if (res.status === 400 && msg.toLowerCase().includes("expired")) {
            formView.hidden   = true;
            invalidView.hidden = false;
            document.getElementById("rp-invalid-msg").textContent = msg;
          } else {
            showAlert(msg);
            btn.disabled = false;
            btn.textContent = "Save new password";
          }
          return;
        }
        formView.hidden   = true;
        successView.hidden = false;
        setTimeout(() => { location.href = "/dashboard.html"; }, 1800);
      } catch {
        showAlert("Network error — please try again.");
        btn.disabled = false;
        btn.textContent = "Save new password";
      }
    });
  </script>

</body>
</html>
