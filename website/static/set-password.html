<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password — PrepWithTee</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap"
    rel="preload" as="style" onload="this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet"></noscript>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=20260831a">
  <style>
    .pw-strength { margin-top: 6px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
    .pw-strength-bar { height: 100%; width: 0; border-radius: 2px; transition: width .25s, background .25s; }
    .pw-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .pw-hint.ok { color: var(--color-success, #2a9d3a); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img width="52" height="52" src="logo-nav.webp" alt="PrepWithTee owl logo">
        <span>PrepWithTee</span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">

      <div class="auth-head">
        <h1>Set your password</h1>
        <p class="auth-sub">Choose a permanent password for your account.</p>
      </div>

      <div class="auth-alert" id="auth-alert" hidden role="alert"></div>

      <form class="auth-form" id="pw-form" novalidate>
        <label class="auth-field" id="current-field" hidden>
          <span>Current password</span>
          <input type="password" name="current_password" autocomplete="current-password"
                 placeholder="Your existing password">
        </label>

        <label class="auth-field">
          <span>New password</span>
          <input type="password" name="password" id="pw-input" autocomplete="new-password"
                 placeholder="At least 8 characters, 1 letter, 1 number" required>
          <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
          <p class="pw-hint" id="pw-hint">Min 8 characters, one letter, one number</p>
        </label>

        <label class="auth-field">
          <span>Confirm password</span>
          <input type="password" name="confirm" autocomplete="new-password"
                 placeholder="Repeat your new password" required>
        </label>

        <button type="submit" class="btn btn-gold auth-submit" id="submit-btn">
          Set password
        </button>
      </form>

    </div>
  </main>

  <script type="module">
    import { getUser, api } from "/auth.js?v=20260829a";

    const form      = document.getElementById("pw-form");
    const alertBox  = document.getElementById("auth-alert");
    const submitBtn = document.getElementById("submit-btn");
    const pwInput   = document.getElementById("pw-input");
    const pwBar     = document.getElementById("pw-bar");
    const pwHint    = document.getElementById("pw-hint");
    const curField  = document.getElementById("current-field");

    function showError(msg) { alertBox.textContent = msg; alertBox.hidden = false; }

    function scorePassword(pw) {
      let s = 0;
      if (pw.length >= 8)  s += 25;
      if (pw.length >= 12) s += 15;
      if (/[A-Z]/.test(pw)) s += 15;
      if (/[a-z]/.test(pw)) s += 15;
      if (/\d/.test(pw)) s += 15;
      if (/[^A-Za-z0-9]/.test(pw)) s += 15;
      return Math.min(s, 100);
    }

    pwInput.addEventListener("input", () => {
      const pw = pwInput.value;
      const score = scorePassword(pw);
      pwBar.style.width = score + "%";
      const colors = ["#e74c3c", "#e67e22", "#f1c40f", "#2ecc71"];
      pwBar.style.background = colors[Math.floor(score / 26)] || colors[3];
      const hasLetter = /[A-Za-z]/.test(pw);
      const hasNumber = /\d/.test(pw);
      const long = pw.length >= 8;
      if (long && hasLetter && hasNumber) {
        pwHint.textContent = score >= 70 ? "Strong password" : "Good password";
        pwHint.className = "pw-hint ok";
      } else {
        const missing = [];
        if (!long) missing.push("8+ chars");
        if (!hasLetter) missing.push("a letter");
        if (!hasNumber) missing.push("a number");
        pwHint.textContent = "Still needs: " + missing.join(", ");
        pwHint.className = "pw-hint";
      }
    });

    // Show current-password field only when not in forced-change mode
    getUser().then(user => {
      if (!user) { location.replace("/login.html"); return; }
      let flags = {};
      try { flags = JSON.parse(user.flags_json || "{}"); } catch {}
      if (!flags.must_change_password) {
        curField.hidden = false;
        curField.querySelector("input").required = true;
      }
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      alertBox.hidden = true;
      const pw      = form.password.value;
      const confirm = form.confirm.value;
      const current = form.current_password?.value;

      if (pw.length < 8) return showError("Password needs at least 8 characters.");
      if (!/[A-Za-z]/.test(pw)) return showError("Password must contain at least one letter.");
      if (!/\d/.test(pw)) return showError("Password must contain at least one number.");
      if (pw !== confirm) return showError("Passwords do not match.");

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";
      try {
        const body = { password: pw };
        if (current) body.current_password = current;
        const result = await api("/auth/set-password", { method: "POST", body });
        const role = result.role || "student";
        if (role === "admin")   { location.replace("/admin.html"); return; }
        if (role === "teacher") { location.replace("/teacher-dashboard.html"); return; }
        location.replace("/dashboard.html");
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Set password";
      }
    });
  </script>

</body>
</html>
